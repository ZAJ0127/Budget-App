    eRet =combo($("#eR"),retItems ,{value:rec.r,allowNew:true});
    eCard=combo($("#eK"),cardItems,{value:rec.k||(S.cards[0]||{}).id});
    let pend=!!rec.p, flip=rec.a<0;
    $("#ePend").onclick=()=>{pend=!pend;$("#ePend").classList.toggle("on",pend);
      $("#ePend").textContent=pend?"⏳ Not cleared":"✓ Cleared";rec._p=pend;};
    $("#eFlip").onclick=()=>{flip=!flip;$("#eFlip").classList.toggle("on",flip);
      $("#eFlip").textContent=flip?"↩ It's a refund":"Make it a refund";rec._f=flip;};
    rec._p=pend;rec._f=flip;
    $("#eFav").onclick=()=>{const f=favOf(rec);
      if(f){removeFav(f.id);toast("Removed from favourites");}else{addFav(rec);toast("Saved as a favourite");}
      $("#eFav").textContent=favOf(rec)?"♥ In favourites — remove":"♡ Save as a favourite";};
    $("#eAgain").onclick=()=>{
      const d=todayIso();
      S.tx.push({id:uid("t"),ts:Date.now(),d,n:rec.n,a:rec.a,s:eCat.id||rec.s,r:eRet.id||rec.r,k:eCard.id||rec.k,y:cycleFor(d),p:1});
      save();closeSheet();view.cycle=cycleFor(d);setTab("pending");toast("Logged again, sitting in Pending");};
    $("#eSub").onclick=()=>{
      const next=addDays(todayIso(),1);
      S.recur=S.recur||[];
      S.recur.push({id:uid("q"),n:rec.n,a:Math.abs(rec.a),freq:"monthly",next,day:dOf(next).getDate(),
                    s:eCat.id||rec.s,r:eRet.id||rec.r,k:eCard.id||rec.k,on:1});
      save();closeSheet();setTab("subs");toast("Added as a monthly subscription — check the date");};
    if(rec.a>0)$("#eRefund").onclick=()=>{
      const d=todayIso();
      S.tx.push({id:uid("t"),d,n:rec.n+" (refund)",a:-Math.abs(rec.a),s:rec.s,r:rec.r,k:rec.k,y:cycleFor(d),p:1});
      save();closeSheet();view.cycle=cycleFor(d);setTab("pending");toast("Refund logged as pending");};
  }
  $("#eSave").onclick=()=>{
    const a=num($("#eA").value); if(!isFinite(a)||a<=0){toast("Enter an amount above zero");return;}
    rec.a=+a.toFixed(2); rec.n=$("#eN").value.trim()||rec.n;
    if($("#eD").value){rec.d=$("#eD").value;rec.y=cycleFor(rec.d);}
    if(kind==="sav"){rec.a=rec._w?-Math.abs(rec.a):Math.abs(rec.a);
      if(rec._sp)rec.p=1;else delete rec.p; delete rec._w;delete rec._sp;}
    if(kind==="tx"){rec.s=eCat.id||rec.s;rec.r=retIdFor(eRet.text);rec.k=eCard.id||rec.k;
      rec.a=rec._f?-Math.abs(rec.a):Math.abs(rec.a);
      if(rec._p)rec.p=1;else delete rec.p;
      delete rec._f;delete rec._p;}
    save();closeSheet();render();toast("Saved");};
  $("#eDel").onclick=()=>{
    const i=arr.indexOf(rec);arr.splice(i,1);save();closeSheet();render();
    undoToast("Deleted “"+(rec.n||"entry")+"”",()=>{arr.splice(Math.min(i,arr.length),0,rec);save();render();});};
}

/* ---------- plan line budget ---------- */
function openLine(lid){
  const l=byId(S.lines,lid),i=view.cycle;
  const b=S.budgets[String(i)]||(S.budgets[String(i)]={});
  const {rows}=planFor(i),row=rows.find(r=>r.line.id===lid);
  const covers=l.kind==="savings"?"Everything you move to savings"
    :l.kind==="group"?"Everything in "+(byId(S.groups,l.g)||{name:"?"}).name
    :l.subs.map(subName).join(", ");
  openSheet(`<div class="sheethead"><h3>${esc(l.name)}</h3>
    <span class="hint" style="margin:0">${fmtShort(cyc(i).s)} – ${fmtShort(cyc(i).e)}</span>
    <button class="close" data-close>×</button></div>
    <label class="f"><span>Budget for this cycle</span>
      <div class="money-in sm"><i>${esc(S.settings.symbol)}</i><input class="num" id="lB" type="text" inputmode="decimal" value="${row.bud||""}" placeholder="0.00"></div></label>
    <div class="card" style="margin-top:14px"><div class="legend"><span>Spent so far</span><b class="num">${money(row.spent)}</b></div>
      <div class="legend" style="margin-top:6px"><span>${row.rem<0?"Over by":row.rem>0?"Remaining":"Nothing left"}</span><b class="num" style="${row.rem<0?'color:var(--over)':row.rem>0?'color:var(--good)':''}">${money(Math.abs(row.rem))}</b></div></div>
    <div class="hint" style="margin-top:12px">Counts: ${esc(covers)}</div>
    <button class="btn" id="lSave">Save budget</button>
    <button class="btn sm ghost" id="lAll">Use this amount for every later cycle</button>`);
  const val=()=>{const v=num($("#lB").value);return isFinite(v)&&v>0?+v.toFixed(2):0;};
  $("#lSave").onclick=()=>{b[lid]=val();save();closeSheet();render();toast("Budget saved");};
  $("#lAll").onclick=()=>{const v=val();
    for(let k=i;k<S.cycles.length;k++){S.budgets[String(k)]=S.budgets[String(k)]||{};S.budgets[String(k)][lid]=v;}
    save();closeSheet();render();toast("Applied to "+(S.cycles.length-i)+" cycles");};
}

/* ---------- accounts ---------- */
function openAccount(id){
  const a=id?byId(S.accounts,id):null;
  const T={bank:"Checking — income less spending and savings",pending:"Pending — not yet cleared",
           linked:"Savings — sums your transfers",savings:"Savings — figure you type in",
           manual:"Owed / committed — figure you type in"};
  const derived=a&&a.type!=="manual"&&a.type!=="savings";
  openSheet(`<div class="sheethead"><h3>${a?esc(a.name):"New account"}</h3><button class="close" data-close>×</button></div>
    <label class="f"><span>Name</span><input class="inp" id="aN" value="${a?esc(a.name):""}" placeholder="e.g. Roth IRA"></label>
    <label class="f"><span>How it's worked out</span><select class="inp" id="aT">
      ${Object.entries(T).map(([k,v])=>`<option value="${k}" ${a&&a.type===k?"selected":""}>${v}</option>`).join("")}
    </select></label>
    <label class="f"><span id="aLbl">${derived?"Adjustment":"Balance"}</span>
      <div class="money-in sm"><i>${esc(S.settings.symbol)}</i><input class="num" id="aB" type="text" inputmode="decimal" value="${a&&a.bal?a.bal:""}" placeholder="0.00"></div></label>
    <div class="hint" id="aHint"></div>
    ${a?`<div class="card" style="margin-top:14px"><div class="legend"><span>Shows as</span><b class="num">${money(accBal(a))}</b></div></div>`:""}
    <button class="btn" id="aSave">${a?"Save":"Add account"}</button>
    ${a?`<button class="btn sm danger" id="aDel">Delete account</button>`:""}`);
  function syncLbl(){
    const t=$("#aT").value;
    $("#aLbl").textContent=(t==="manual"||t==="savings")?"Balance":"Adjustment";
    $("#aHint").textContent=
      t==="bank"?"Every income entry, less every cleared purchase, less what's sitting in your savings accounts. Use the adjustment to true it up to what your bank actually shows."
     :t==="pending"?"Mirrors whatever is sitting on the Pending tab."
     :t==="linked"?"Adds up all "+S.sav.length+" savings transfers you've logged. The adjustment is the balance before the first one."
     :t==="savings"?"A savings figure you keep up to date. Counts toward total savings and comes off checking."
     :"A commitment you keep up to date, like preorders. Comes off what's free to spend.";
  }
  $("#aT").onchange=syncLbl; syncLbl();
  $("#aSave").onclick=()=>{
    const n=$("#aN").value.trim(); if(!n){toast("Give it a name");return;}
    const v=num($("#aB").value),bal=isFinite(v)?+v.toFixed(2):0,type=$("#aT").value;
    if(a){a.name=n;a.type=type;a.bal=bal;if(type==="manual")a.upd=todayIso();}
    else S.accounts.push({id:uid("a"),name:n,type,bal,upd:todayIso()});
    save();closeSheet();render();toast("Saved");};
  if(a)$("#aDel").onclick=()=>{
    if(!confirm("Delete "+a.name+"? Your transactions aren't affected."))return;
    S.accounts=S.accounts.filter(x=>x.id!==id);save();closeSheet();render();toast("Deleted");};
}

function openList(kind,opts){
  opts=opts||{};
  const T={cat:"Categories",ret:"Retailers",card:"Payment methods",line:"Plan lines"}[kind];
  const searchable=kind==="cat"||kind==="ret";
  let body="",jump="";
  if(kind==="cat"){
    const gTot={};for(const t of S.tx){const c=catOf(t.s);if(c)gTot[c.g]=(gTot[c.g]||0)+t.a;}
    jump=`<div class="chips" id="listJump" style="margin-top:9px">${S.groups.map(g=>`<button type="button" class="chip" data-jump="jg-${g.id}">${esc(g.name)}</button>`).join("")}</div>`;
    body=S.groups.map(g=>`<div class="daylabel" id="jg-${g.id}">${esc(g.name)} · ${catsOfGroup(g.id).length} categories${gTot[g.id]?" · "+money0(gTot[g.id])+" all time":""}</div>`+
      catsOfGroup(g.id).map(c=>{
        const subNames=subsOfCat(c.id).map(x=>x.name);
        const st=(c.name+" "+g.name+" "+subNames.join(" ")).toLowerCase();
        return `<button class="row" data-item="cat:${c.id}" data-st="${esc(st)}"><div class="main"><b>${esc(c.name)}</b><span>in ${esc(g.name)} · ${subNames.length} sub-categories · tap to move</span></div><div class="amt" style="color:var(--faint);font-weight:400">›</div></button>`+
          subsOfCat(c.id).map(s=>`<button class="row sub" data-item="sub:${s.id}" data-st="${esc((s.name+" "+c.name+" "+g.name).toLowerCase())}"><div class="main"><b>${esc(s.name)}</b></div><div class="amt" style="color:var(--faint);font-weight:400">›</div></button>`).join("");
      }).join("")).join("");
  } else if(kind==="line"){
    body=S.lines.map(l=>`<button class="row" data-item="line:${l.id}"><div class="main"><b>${esc(l.name)}</b><span>${l.kind==="savings"?"Savings":l.kind==="group"?"Group: "+(byId(S.groups,l.g)||{name:"?"}).name:l.subs.length+" sub-categories"}</span></div><div class="amt" style="color:var(--faint);font-weight:400">›</div></button>`).join("");
  } else {
    const arr=kind==="ret"?S.retailers:S.cards,pfx=kind==="ret"?"ret":"card";
    body=arr.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<button class="row" data-item="${pfx}:${x.id}" data-st="${esc(x.name.toLowerCase())}"><div class="main"><b>${esc(x.name)}</b></div><div class="amt" style="color:var(--faint);font-weight:400">›</div></button>`).join("");
  }
  const search=searchable?`<div style="padding:11px 15px 0"><input class="inp" id="listSearch" placeholder="Search ${kind==="cat"?"categories":"retailers"}" autocomplete="off" value="${esc(opts.q||"")}"></div>`:"";
  openSheet(`<div class="sheethead"><h3>${T}</h3><button class="close" data-close>×</button></div>
    ${search}${jump}
    <div class="card flush" id="listBody" style="margin-top:12px;max-height:50vh;overflow:auto">${body||'<div class="empty">Nothing here yet.</div>'}</div>
    <button class="btn sm ghost" data-add="${kind}">Add ${kind==="cat"?"a category":kind==="ret"?"a retailer":kind==="card"?"a payment method":"a plan line"}</button>`);
  if(searchable){
    const inp=$("#listSearch");
    if(opts.q)filterListSearch(opts.q);
    inp.addEventListener("input",()=>filterListSearch(inp.value));
    if(opts.focus)setTimeout(()=>inp.focus(),50);
  }
}
function filterListSearch(q){
  q=q.trim().toLowerCase();
  const rows=document.querySelectorAll("#listBody [data-item]");
  const heads=document.querySelectorAll("#listBody .daylabel");
  rows.forEach(r=>{r.style.display=(!q||(r.dataset.st||"").includes(q))?"":"none";});
  heads.forEach(h=>{
    let n=h.nextElementSibling,any=false;
    while(n&&!n.classList.contains("daylabel")){if(n.style.display!=="none")any=true;n=n.nextElementSibling;}
    h.style.display=(!q||any)?"":"none";
  });
  const jw=$("#listJump");if(jw)jw.style.display=q?"none":"";
}

function countUse(kind,id){
  if(kind==="sub")return S.tx.filter(t=>t.s===id).length;
  if(kind==="cat")return S.tx.filter(t=>{const c=catOf(t.s);return c&&c.id===id;}).length;
  if(kind==="ret")return S.tx.filter(t=>t.r===id).length;
  if(kind==="card")return S.tx.filter(t=>t.k===id).length;
  return 0;
}
function openItem(kind,id){
  if(kind==="line")return openLineEdit(id);
  const arr=kind==="cat"?S.cats:kind==="sub"?S.subs:kind==="ret"?S.retailers:S.cards;
  const it=id?byId(arr,id):null,used=id?countUse(kind,id):0;
  let extra="";
  if(kind==="cat") extra=`<div class="f"><span>Which group</span>
      <div class="seg">${S.groups.map(g=>`<button type="button" data-grp="${g.id}" class="${it&&it.g===g.id?"on":(!it&&g.id===S.groups[0].id?"on":"")}">${esc(g.name)}</button>`).join("")}</div>
      <div class="hint">Everything filed under this category counts toward that group.</div></div>`;
  if(kind==="sub") extra=`<div class="f"><span>Belongs to</span><div id="iP"></div>
      <div class="hint" id="iPnote"></div></div>`;
  openSheet(`<div class="sheethead"><h3>${it?"Edit":"New"} ${kind==="cat"?"category":kind==="sub"?"sub-category":kind==="ret"?"retailer":"payment method"}</h3><button class="close" data-close>×</button></div>
    <label class="f"><span>Name</span><input class="inp" id="iN" value="${it?esc(it.name):""}" autocomplete="off"></label>
    ${extra}
    ${used?`<div class="hint" style="margin-top:10px">Used by ${used} entries.</div>`:""}
    <button class="btn" id="iSave">${it?"Save":"Add"}</button>
    ${it&&kind==="cat"?`<button class="btn sm ghost" id="iMerge">Move into another category</button>`:""}
    ${it?`<button class="btn sm danger" id="iDel">Delete</button>`:""}`);
  let iPar=null,iGrp=it&&kind==="cat"?it.g:S.groups[0].id;
  if(kind==="cat"){
    document.querySelectorAll("[data-grp]").forEach(b=>b.addEventListener("click",()=>{
      iGrp=b.dataset.grp;
      document.querySelectorAll("[data-grp]").forEach(x=>x.classList.toggle("on",x.dataset.grp===iGrp));
    }));
  }
  if(kind==="sub"){
    const note=()=>{const c=byId(S.cats,iPar&&iPar.id);
      $("#iPnote").textContent=c?"So it counts toward "+((byId(S.groups,c.g)||{}).name||"—")+".":"";};
    iPar=combo($("#iP"),()=>S.cats.map(c=>({id:c.id,name:c.name,sub:(byId(S.groups,c.g)||{}).name})),
      {value:it?it.c:S.cats[0].id,onPick:note});
    note();
  }
  $("#iSave").onclick=()=>{
    const n=$("#iN").value.trim(); if(!n){toast("Give it a name");return;}
    if(it){it.name=n; if(kind==="cat")it.g=iGrp; if(kind==="sub"&&iPar.id)it.c=iPar.id;}
    else{
      const o={id:uid(kind[0]),name:n};
      if(kind==="cat"){o.g=iGrp||S.groups[0].id;S.cats.push(o);}
      else if(kind==="sub"){o.c=iPar.id||S.cats[0].id;S.subs.push(o);}
      else if(kind==="ret")S.retailers.push(o); else S.cards.push(o);
    }
    save();fillSelects();closeSheet();openList(kind==="sub"?"cat":kind);render();toast("Saved");};
  if(it&&kind==="cat")$("#iMerge").onclick=()=>{
    const targets=S.cats.filter(c=>c.id!==it.id).map(c=>({id:c.id,name:c.name,sub:(byId(S.groups,c.g)||{}).name}));
    const mySubs=subsOfCat(it.id);
    openSheet(`<div class="sheethead"><h3>Move “${esc(it.name)}”</h3><button class="close" data-close>×</button></div>
      <div class="hint" style="margin:10px 0 0">Categories can't nest inside each other — only sub-categories can.
        So moving “${esc(it.name)}” into another category turns ${mySubs.length?"its "+mySubs.length+" sub-categor"+(mySubs.length===1?"y":"ies"):"it"} into
        sub-categor${mySubs.length===1?"y":"ies"} there, and “${esc(it.name)}” itself goes away.</div>
      <div class="f"><span>Move into</span><div id="mergeTo"></div></div>
      <button class="btn" id="mergeGo">Move it</button>`);
    const mv=combo($("#mergeTo"),()=>targets,{placeholder:"Type or pick a category"});
    $("#mergeGo").onclick=()=>{
      const to=mv.id;if(!to){toast("Pick a category to move it into");return;}
      const dest=byId(S.cats,to);
      if(mySubs.length){
        mySubs.forEach(s=>{s.c=to;});
      } else {
        S.subs.push({id:uid("s"),name:it.name,c:to});
      }
      S.cats=S.cats.filter(c=>c.id!==it.id);
      save();fillSelects();closeSheet();openList("cat");render();
      toast("Moved into "+dest.name);
    };
  };
  if(it)$("#iDel").onclick=()=>{
    if(kind==="cat"&&subsOfCat(it.id).length){
      toast("It has sub-categories — use “Move into another category” above, or delete those first");return;}
    if(!used){
      if(!confirm("Delete “"+it.name+"”?"))return;
      arr.splice(arr.indexOf(it),1);
      S.lines.forEach(l=>{if(l.subs)l.subs=l.subs.filter(x=>x!==id);});
      save();fillSelects();closeSheet();openList(kind==="sub"?"cat":kind);render();toast("Deleted");
      return;
    }
    if(kind==="ret"||kind==="card"){
      if(!confirm(used+" entries use “"+it.name+"”. Delete it and leave them blank?"))return;
      arr.splice(arr.indexOf(it),1);
      S.tx.forEach(t=>{if(kind==="ret"&&t.r===id)t.r="";if(kind==="card"&&t.k===id)t.k="";});
      (S.recur||[]).forEach(r=>{if(kind==="ret"&&r.r===id)r.r="";if(kind==="card"&&r.k===id)r.k="";});
      save();fillSelects();closeSheet();openList(kind);render();toast("Deleted");
      return;
    }
    /* categories in use must hand their entries somewhere */
    const opts=(kind==="sub"
      ? S.subs.filter(x=>x.id!==id).map(x=>({id:x.id,name:x.name,sub:catPathOf(x.id)}))
      : S.cats.filter(x=>x.id!==id).map(x=>({id:x.id,name:x.name,sub:(byId(S.groups,x.g)||{}).name})));
    openSheet(`<div class="sheethead"><h3>Delete “${esc(it.name)}”</h3><button class="close" data-close>×</button></div>
      <div class="hint" style="margin:10px 0 0">${used} entries use it, so they need somewhere to go.
        Pick a replacement, or go back and rename it instead.</div>
      <div class="f"><span>Move those ${used} entries to</span><div id="mvTo"></div></div>
      <button class="btn danger" id="mvGo" style="background:none;border:1px solid var(--line)">Move them and delete</button>
      <button class="btn sm ghost" data-close>Keep it</button>`);
    const mv=combo($("#mvTo"),()=>opts,{placeholder:"Type or pick"});
    $("#mvGo").onclick=()=>{
      const to=mv.id; if(!to){toast("Pick where they should go");return;}
      if(kind==="sub"){S.tx.forEach(t=>{if(t.s===id)t.s=to;});(S.recur||[]).forEach(r=>{if(r.s===id)r.s=to;});
        S.lines.forEach(l=>{if(l.subs){l.subs=l.subs.filter(x=>x!==id);if(!l.subs.includes(to))l.subs.push(to);}});
        S.subs.splice(S.subs.indexOf(it),1);
      } else {
        const moving=subsOfCat(it.id);
        moving.forEach(x=>{x.c=to;});
        S.cats.splice(S.cats.indexOf(it),1);
      }
      save();fillSelects();closeSheet();openList("cat");render();toast("Moved and deleted");};
  };
}

function openLineEdit(id){
  const l=id?byId(S.lines,id):null;
  const chosen=new Set(l&&l.subs?l.subs:[]);
  const picker=S.groups.map(g=>catsOfGroup(g.id).map(c=>
    `<div class="daylabel">${esc(g.name)} › ${esc(c.name)}</div>`+
    subsOfCat(c.id).map(s=>`<label class="row"><input type="checkbox" class="lsub" value="${s.id}" ${chosen.has(s.id)?"checked":""} style="width:20px;height:20px"><div class="main"><b style="font-weight:450">${esc(s.name)}</b></div></label>`).join("")).join("")).join("");
  openSheet(`<div class="sheethead"><h3>${l?"Edit":"New"} plan line</h3><button class="close" data-close>×</button></div>
    <label class="f"><span>Name</span><input class="inp" id="iN" value="${l?esc(l.name):""}"></label>
    <div class="f"><span>On the plan it's</span>
      <div class="seg"><button type="button" id="lfFixed" class="${l&&isFixed(l)?"on":""}">Fixed bill</button>
        <button type="button" id="lfFlex" class="${l&&!isFixed(l)?"on":(l?"":"on")}">Flexible</button></div>
      <div class="hint">Fixed lines fold into one summary row on the Cycle page.</div></div>
    ${l&&l.kind!=="subs"?`<div class="hint" style="margin-top:10px">This line covers ${l.kind==="savings"?"savings transfers":"the whole "+(byId(S.groups,l.g)||{name:"?"}).name+" group"}, so it has no sub-category list.</div>`
      :`<div style="margin-top:14px"><span class="hint">Counts spending in these sub-categories</span>
        <div class="card flush" style="margin-top:6px;max-height:44vh;overflow:auto">${picker}</div></div>`}
    <button class="btn" id="iSave">${l?"Save":"Add line"}</button>
    ${l?`<button class="btn sm danger" id="iDel">Delete line</button>`:""}`);
  let fx=l?isFixed(l):false;
  $("#lfFixed").onclick=()=>{fx=true;$("#lfFixed").classList.add("on");$("#lfFlex").classList.remove("on");};
  $("#lfFlex").onclick=()=>{fx=false;$("#lfFlex").classList.add("on");$("#lfFixed").classList.remove("on");};
  $("#iSave").onclick=()=>{
    const n=$("#iN").value.trim(); if(!n){toast("Give it a name");return;}
    const picks=[...document.querySelectorAll(".lsub:checked")].map(x=>x.value);
    if(l){l.name=n;l.fixed=fx?1:0; if(l.kind==="subs")l.subs=picks;}
    else S.lines.push({id:uid("p"),name:n,kind:"subs",subs:picks,fixed:fx?1:0});
    save();closeSheet();openList("line");render();toast("Saved");};
  if(l)$("#iDel").onclick=()=>{
    if(!confirm("Delete this plan line? Its budget amounts go with it."))return;
    S.lines=S.lines.filter(x=>x.id!==id);
    for(const k in S.budgets)delete S.budgets[k][id];
    save();closeSheet();openList("line");render();toast("Deleted");};
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-close]"))return closeSheet();
  const ed=t.closest("[data-edit]");if(ed)return openEdit(ed.dataset.edit,ed.dataset.kind);
  const ln=t.closest("[data-line]");if(ln)return openLine(ln.dataset.line);
  const lo=t.closest("[data-loose]");if(lo){view.filter=null;setTab("log");return;}
  const li=t.closest("[data-list]");if(li)return openList(li.dataset.list);
  const it=t.closest("[data-item]");if(it){const[k,i]=it.dataset.item.split(":");return openItem(k,i);}
  const ad=t.closest("[data-add]");if(ad){const k=ad.dataset.add;return k==="line"?openLineEdit(null):openItem(k==="cat"?"cat":k,null);}
  const rg=t.closest("[data-range]");
  if(rg){const k=rg.dataset.range;view.rangeTouched=1;
    view.range=k==="custom"?{from:addDays(todayIso(),-27),to:todayIso()}:k;
    render();openFilters();return;}
  const so=t.closest("[data-sort]");if(so){view.byAdded=so.dataset.sort==="added";render();openFilters();return;}
  const fl=t.closest("[data-filter]");
  if(fl){const v=fl.dataset.filter;
    view.filter=v?{type:v.split(":")[0],id:v.split(":")[1]}:null;render();openFilters();return;}
  const ps=t.closest("[data-pullsav]");if(ps)return openPullSav(ps.dataset.pullsav);
  const cvw=t.closest("[data-cyview]");if(cvw){view.cyView=cvw.dataset.cyview;renderPlan();return;}
  const jp=t.closest("[data-jump]");if(jp){const el=document.getElementById(jp.dataset.jump);
    if(el&&el.scrollIntoView)el.scrollIntoView({block:"start"});return;}
  const tg=t.closest("[data-toggle]");if(tg){view[tg.dataset.toggle]=!view[tg.dataset.toggle];renderHistory();return;}
  const uf=t.closest("[data-usefav]");if(uf){setTab("add");useFav(uf.dataset.usefav);return;}
  const df=t.closest("[data-delfav]");if(df){removeFav(df.dataset.delfav);openFavs();toast("Removed");return;}
  const fo=t.closest("[data-fold]");if(fo){const k=fo.dataset.fold;
    if(k==="acc")view.accOpen=!view.accOpen;else view.folds=Object.assign({},view.folds,{[k]:!(view.folds||{})[k]});
    render();return;}
  const kc=t.closest("[data-carry]");if(kc)return openCarry(+kc.dataset.carry);
  const xp=t.closest("[data-expect]");if(xp)return openExpected(+xp.dataset.expect);
  const rc=t.closest("[data-recur]");if(rc)return openRecur(rc.dataset.recur);
  const ac=t.closest("[data-acc]");if(ac)return openAccount(ac.dataset.acc);
  const tj=t.closest("[data-tabjump]");if(tj)return setTab(tj.dataset.tabjump);
  const wn=t.closest("[data-win]");if(wn){view.win=+wn.dataset.win;S.settings.statsWin=view.win;
    view.pick=null;save();renderHistory();return;}
  const bar=t.closest("[data-bar]");if(bar){const i=+bar.dataset.bar;
    view.pick=view.pick===i?null:i;renderHistory();return;}
  const ct=t.closest("[data-cat]");if(ct){
    view.openCat=view.openCat===ct.dataset.cat?null:ct.dataset.cat;renderHistory();return;}
  const cs=t.closest("[data-clearsav]");if(cs){
    const rec=S.sav.find(x=>x.id===cs.dataset.clearsav);
    if(rec){delete rec.p;save();render();toast(money(Math.abs(rec.a))+" landed");}
    return;}
  const cl=t.closest("[data-clear]");if(cl){
    const rec=S.tx.find(x=>x.id===cl.dataset.clear);
    if(rec){delete rec.p;save();render();undoToast(money(Math.abs(rec.a))+" cleared",()=>{rec.p=1;save();render();});}
    return;}
  switch(t.id){
    case "logQx":view.q="";renderLog();return;
    case "openFilters":openFilters();return;
    case "setupFavs":openFavs();return;
    case "clearFilters":view.range="cycle";view.filter=null;view.byAdded=false;view.rangeTouched=0;closeSheet();render();return;
    case "openSetup":setTab("setup");return;
    case "backBtn":setTab(view.from||"stats");return;
    case "clearAll":
      if(confirm("Mark all "+(pendingTx().length+pendSav().length)+" pending entries as cleared?")){
        S.tx.forEach(x=>{delete x.p;});S.sav.forEach(x=>{delete x.p;});save();render();toast("All cleared");}
      return;
  }
  switch(t.id){
    case "prevCycle":if(view.cycle>0){view.cycle--;render();}break;
    case "nextCycle":if(view.cycle<S.cycles.length-1){view.cycle++;render();}break;
    case "cycleMeta":case "cycleName":case "cycleDates":if(view.cycle!==nowCycle()){view.cycle=nowCycle();render();}break;
    case "dfMDY":S.settings.dateFormat="MDY";save();setDate(view.date);render();break;
    case "dfDMY":S.settings.dateFormat="DMY";save();setDate(view.date);render();break;
    case "saveLabels":
      S.labels={net:$("#lbNet").value.trim()||"Net worth",
                free:$("#lbFree").value.trim()||"Free to spend",
                sav:$("#lbSav").value.trim()||"Total savings"};
      save();render();toast("Names saved");break;
    case "saveSettings":{
      S.settings.symbol=$("#setSym").value.trim()||"$";
      const f=num($("#setFloor").value);S.settings.floor=isFinite(f)&&f>0?+f.toFixed(2):0;
      save();render();toast("Saved");break;}
    case "copyPrev":{
      const p=S.budgets[String(view.cycle-1)];
      if(!p){toast("No plan on the previous cycle");break;}
      S.budgets[String(view.cycle)]=Object.assign({},p);save();render();toast("Plan copied");break;}
    case "doExport":{
      const b=new Blob([JSON.stringify(S)],{type:"application/json"});dl(b,"budget-backup-"+todayIso()+".json");
      toast("Backup saved");break;}
    case "doCsv":{
      const rows=[["Date","Item","Amount","Group","Category","Sub-category","Retailer","Paid with"]];
      for(const t2 of S.tx.slice().sort((a,b)=>a.d<b.d?-1:1)){
        const c=catOf(t2.s),g=groupOf(t2.s);
        rows.push([t2.d,t2.n,t2.a,g?g.name:"",c?c.name:"",subName(t2.s),retName(t2.r),cardName(t2.k)]);}
      const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
      dl(new Blob([csv],{type:"text/csv"}),"spending-"+todayIso()+".csv");toast("CSV saved");break;}
    case "doImport":$("#importFile").click();break;
    case "doReset":
      if(confirm("Throw away every change and go back to the data imported from your sheet?")){
        S=JSON.parse(JSON.stringify(SEED));save();fillSelects();view.cycle=nowCycle();render();toast("Reset");}
      break;
  }
});
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
let qT;
document.addEventListener("input",e=>{
  if(e.target.id!=="logQ")return;
  view.q=e.target.value;
  if(view.q&&!view.rangeTouched&&(!view.range||view.range==="cycle"))view.range="all";
  clearTimeout(qT);qT=setTimeout(()=>{const el=$("#logQ"),pos=el.selectionStart;renderLog();
    const el2=$("#logQ");if(el2){el2.focus();try{el2.setSelectionRange(pos,pos);}catch(x){}}},260);
});
document.addEventListener("change",e=>{
  if(e.target.id==="rFrom"||e.target.id==="rTo"){
    const f=$("#rFrom").value,t2=$("#rTo").value;
    view.range={from:f||"1900-01-01",to:t2||"2999-12-31"};view.tab==="log"&&renderLog();return;}
  if(e.target.id!=="importFile")return;
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.cycles||!d.subs)throw 0;
    if(!confirm("Replace everything on this device with the backup?"))return;
    S=d;save();fillSelects();view.cycle=nowCycle();setDate(todayIso());render();toast("Backup restored");}
    catch(err){toast("That file isn't a backup from this app");}};
  r.readAsText(f);e.target.value="";});

let tx0=0,ty0=0;
document.addEventListener("touchstart",e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if($("#sheet").classList.contains("on"))return;
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>70&&Math.abs(dy)<50){
    const n=view.cycle+(dx<0?1:-1);
    if(n>=0&&n<S.cycles.length){view.cycle=n;render();}}
},{passive:true});

load();fillSelects();
view.cycle=nowCycle();view.win=+S.settings.statsWin||0;view.cyView="plan";setMode("spend");setDate(todayIso());
if(S.cards[0])$("#fCard").value=S.cards[0].id;
const fired=runRecurring();
setTab("stats");
if(fired.made)setTimeout(()=>toast(fired.made+" subscription charge"+(fired.made===1?"":"s")+" added to Pending"),1000);

/* offline install */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
    let reloading=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(reloading)return; reloading=true; toast("Updated — reopening"); setTimeout(()=>location.reload(),700);
    });
  });
}
</script>
</body>
</html>
