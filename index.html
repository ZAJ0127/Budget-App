<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E9E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111721" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cycle</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cycle">
<style>
:root{
  --bg:#E8ECF2; --surface:#FFFFFF; --ink:#141B26; --muted:#56637A; --faint:#6B778C;
  --line:#D3DAE6; --accent:#1F4E9E; --soft:#DCE6F5; --income:#1F7A8C; --over:#A83A2E;
  --save:#6B4E9E; --good:#2E7D5B; --amber:#B57A15;
  --warnbg:#FBEFD6; --warnline:#E7CE9A; --warnink:#6B4E12;
  --dangerbg:#F7DED8; --dangerline:#DFB0A6; --dangerink:#7A2A1E;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111721; --surface:#1A2230; --ink:#E7ECF4; --muted:#A3AFC2; --faint:#8592A6;
  --line:#2A3446; --accent:#7AA6F0; --soft:#22324F; --income:#63C4D4; --over:#E8837A;
  --save:#B9A5EA; --good:#6FCB9C; --amber:#E0B25C;
  --warnbg:#3A3122; --warnline:#6B5A2E; --warnink:#F0D9A0;
  --dangerbg:#3D2320; --dangerline:#6E3A33; --dangerink:#F3B8AE;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 7px;border-bottom:1px solid var(--line)}
.cyclenav{display:flex;align-items:center;gap:4px}
.cyclenav>button.navbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:22px;flex:none}
.cyclenav>button.navbtn:disabled{color:var(--faint)}
.cyclemeta{flex:1;text-align:center;line-height:1.2;min-width:0;padding:2px 4px;border-radius:10px}
.cyclemeta:active{background:var(--soft)}
.cyclemeta b{display:block;font-size:15px}
.cyclemeta span{display:block;font-size:12.5px;color:var(--muted)}
.today-chip{font-size:12px;color:var(--accent);border:1px solid var(--accent);padding:2px 9px;border-radius:999px;margin-top:4px;display:inline-block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card.flush{padding:0;overflow:hidden}
.card h2{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:10px}

.meter-amt{font-size:42px;font-weight:680;line-height:1.05;margin-top:2px}
.meter-amt.over{color:var(--over)}
.meter-amt.good{color:var(--good)}
.amt.good,.pr.good{color:var(--good)}
.meter-sub{color:var(--muted);font-size:14px;margin-top:2px}
.bar{position:relative;height:13px;background:var(--soft);border-radius:3px;margin:16px 0 8px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar.over .fill{background:var(--over)}
.bar .pace{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.bar .pace::after{content:"";position:absolute;left:-3px;top:-4px;width:8px;height:8px;background:var(--ink);border-radius:50%}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.stats{display:flex;margin-top:15px;border-top:1px solid var(--line);padding-top:13px}
.stat{flex:1;border-left:1px solid var(--line);padding-left:12px}
.stat:first-child{border-left:none;padding-left:0}
.stat b{display:block;font-size:18px;font-weight:640}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.in b{color:var(--income)} .stat.sv b{color:var(--save)}

.row{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:none}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:560;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:620;font-size:15px;flex:none;text-align:right}
.row .amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.row .amt.in{color:var(--income)} .row .amt.sv{color:var(--save)} .row .amt.over{color:var(--over)}
.sub .main b{font-weight:450;color:var(--muted);padding-left:15px;position:relative}
.sub .main b::before{content:"";position:absolute;left:2px;top:50%;width:8px;height:1px;background:var(--faint)}
.catbar{height:4px;background:var(--soft);border-radius:2px;margin-top:6px;overflow:hidden}
.catbar i{display:block;height:100%;background:var(--accent)}
.catbar.over i{background:var(--over)}
.daylabel{padding:9px 15px 5px;font-size:12px;color:var(--faint);background:var(--surface);border-top:1px solid var(--line);font-weight:600}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

label.f{display:block;margin-top:14px}
label.f>span,.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.inp,select.inp{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);appearance:none}
select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%235E6B66' stroke-width='1.8'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
.money-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.money-in i{font-style:normal;font-size:23px;color:var(--faint);margin-right:6px}
.money-in input{border:none;background:none;flex:1;font-size:31px;font-weight:640;padding:11px 0;width:100%;outline:none}
.money-in.sm input{font-size:19px;padding:9px 0} .money-in.sm i{font-size:16px}
.datewrap{display:flex;gap:8px}
.datewrap .inp{flex:1}
.datewrap .datefield{flex:none;width:50px;position:relative}
.datewrap button{flex:none;width:50px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:18px}
.hint{font-size:13px;color:var(--faint);margin-top:5px}
.hint.warn{color:var(--over)}
.chips{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;color:var(--muted);min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:15px;font-weight:620;font-size:16px;margin-top:18px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--over);border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:14.5px;margin-top:10px}
.two{display:flex;gap:10px}
.two .f{flex:1;min-width:0;margin-top:14px}
.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:25;padding:8px 14px 10px;
  background:linear-gradient(to top,var(--bg) 70%,transparent);display:none}
.savebar.on{display:block}
.savebar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.savebar .btn{margin:0;flex:1}
.heart{flex:none;width:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;color:var(--faint);display:grid;place-items:center}
.heart.on{color:var(--over);border-color:var(--over)}
.favrow .x{flex:none;width:40px;height:40px;display:grid;place-items:center;color:var(--faint);font-size:18px}
.fold{padding:10px 15px;font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.fold .chev{color:var(--faint);font-weight:400}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:10px 4px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 11px;color:var(--faint);font-size:11px;position:relative;display:grid;justify-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--accent)}

.panel{display:none}.panel.on{display:block}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,32,29,.45);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sheet h3{font-size:18px;margin-bottom:2px}
.sheethead{position:relative;padding-right:36px;margin-bottom:2px}
.close{position:absolute;right:-2px;top:-4px;font-size:24px;color:var(--muted);width:34px;height:34px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;display:flex;gap:14px;align-items:center;z-index:60;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1;pointer-events:auto}
.toast button{color:#9FC4FF;font-weight:650}
.banner{background:var(--warnbg);border:1px solid var(--warnline);color:var(--warnink);font-size:13px;padding:11px 13px;border-radius:10px;margin-top:12px}
.planline{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--line)}
.planline:first-child{border-top:none}
.planline .pl{flex:1;min-width:0}
.planline .pl b{display:block;font-size:14.5px;font-weight:560}
.planline .pl span{font-size:12px;color:var(--muted)}
.planline .pr{text-align:right;flex:none;font-size:14.5px;font-weight:620}
.planline .pr small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.mini{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.kpi{background:var(--surface);padding:13px 14px}
.kpi b{display:block;font-size:21px;font-weight:660;line-height:1.15}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.in b{color:var(--income)} .kpi.sv b{color:var(--save)} .kpi.neg b{color:var(--over)}
.chartbox{margin-top:10px}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.readout{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);min-height:19px;margin-bottom:2px}
.readout b{color:var(--ink);font-size:13.5px}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.keys{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.hbar{display:flex;align-items:center;gap:10px;padding:9px 15px;border-top:1px solid var(--line);width:100%;text-align:left}
.hbar:first-child{border-top:none}
.hbar .hl{flex:1;min-width:0}
.hbar .hl b{display:block;font-size:14px;font-weight:540}
.hbar .track{height:6px;background:var(--soft);border-radius:3px;margin-top:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbar .hv{flex:none;text-align:right;font-size:14px;font-weight:620}
.hbar .hv small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

/* pending + refunds */
.check{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:15px;background:var(--surface)}
.check.done{background:var(--accent);color:#fff}
.pendot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber,#B57A15);margin-right:5px;vertical-align:middle}
.amt.refund{color:var(--income)}
.cyclenav>button.gear{color:var(--muted)}
.gear svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none}
.pagetitle{flex:1;font-size:17px;font-weight:650;padding-left:6px}
.badge{position:absolute;top:6px;right:50%;transform:translateX(18px);background:var(--over);color:#fff;font-size:10px;line-height:1;padding:3px 5px;border-radius:999px;font-weight:600}
/* combo box */
.combo{position:relative}
.combo input{padding-right:40px}
.comboArrow{position:absolute;right:2px;top:2px;bottom:2px;width:38px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.combo.up .comboList{top:auto;bottom:calc(100% + 4px)}
.comboList{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;max-height:246px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:0 8px 24px rgba(20,32,29,.14)}
.comboItem{display:block;width:100%;text-align:left;padding:11px 13px;border-top:1px solid var(--line);font-size:15px}
.comboItem:first-child{border-top:none}
.comboItem i{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:1px}
.comboItem.new{color:var(--accent);font-weight:560}
.comboEmpty{padding:13px;color:var(--muted);font-size:14px}
.searchwrap{position:relative}
.searchwrap .inp{padding-right:38px}
.searchwrap button{position:absolute;right:2px;top:2px;bottom:2px;width:34px;color:var(--muted);font-size:17px}
.rangewrap{display:flex;gap:8px;margin-top:8px}
.rangewrap label{flex:1;font-size:11.5px;color:var(--muted)}
.rangewrap input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-top:3px}
.datefield{position:relative}
.datefield input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;background:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="cyclenav">
      <button id="backBtn" class="navbtn" aria-label="Back" hidden>‹</button>
      <button id="prevCycle" class="navbtn" aria-label="Previous cycle">‹</button>
      <button class="cyclemeta" id="cycleMeta" style="padding:0"><b id="cycleName">Cycle</b><span id="cycleDates">—</span></button>
      <div class="pagetitle" id="pageTitle" hidden>Statistics</div>
      <button id="nextCycle" class="navbtn" aria-label="Next cycle">›</button>
      <button class="gear navbtn" id="openSetup" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/></svg></button>
    </div>
  </header>
  <div id="storeWarn" class="banner" hidden></div>

  <section class="panel on" id="p-add">
    <div class="card" style="padding-bottom:8px">
      <div class="seg" style="margin-bottom:10px">
        <button id="mSpend" class="on">Spending</button>
        <button id="mIncome">Income</button>
        <button id="mSave">Savings</button>
      </div>
      <button class="btn sm ghost" id="openFavs" style="margin-top:0">♥ Favourites</button>
      <label class="f"><span id="lblAmount">Price</span>
        <div class="money-in"><i>$</i><input class="num" id="fAmount" type="text" inputmode="decimal" placeholder="0.00"></div>
      </label>
      <label class="f"><span id="lblName">Item name</span>
        <input class="inp" id="fName" type="text" autocomplete="off" placeholder="e.g. Bounty Hunter Funko"></label>
      <div class="two" id="wCatCard">
        <div class="f" id="wCat"><span>Category</span><div id="fCat"></div></div>
        <div class="f" id="wCard"><span>Paid with</span><div id="fCard"></div></div>
      </div>
      <div class="f" id="wRet"><span>Retailer</span><div id="fRet"></div></div>
      <label class="f"><span>Date</span>
        <div class="datewrap">
          <input class="inp num" id="fDateText" type="text" placeholder="9/5/26 or 090526" autocomplete="off">
          <div class="datefield"><button type="button" tabindex="-1" aria-hidden="true">📅</button>
            <input type="date" id="fDatePick" aria-label="Pick a date"></div>
        </div>
        <div class="hint" id="dateEcho">—</div>
        <div class="chips">
          <button type="button" class="chip" data-quick="0">Today</button>
          <button type="button" class="chip" data-quick="-1">Yesterday</button>
          <button type="button" class="chip" data-quick="-2">2 days ago</button>
        </div></label>
      <div class="chips" style="margin-top:14px">
        <button type="button" class="chip" id="tPending">⏳ Hasn't cleared yet</button>
        <button type="button" class="chip" id="tRefund">↩ Money coming back</button>
        <button type="button" class="chip" id="tWithdraw">↩ Taking money out</button>
      </div>
      <div style="height:6px"></div>
    </div>
    <div style="height:84px"></div>
  </section>
  <div class="savebar" id="savebar"><div class="inner">
    <button class="heart" id="favThis" aria-label="Save as a favourite" title="Save as a favourite">♡</button>
    <button class="btn" id="saveEntry">Add spending</button>
  </div></div>
  <section class="panel" id="p-stats"></section>
  <section class="panel" id="p-history"></section>
  <section class="panel" id="p-pending"></section>
  <section class="panel" id="p-subs"></section>
  <section class="panel" id="p-plan"></section>
  <section class="panel" id="p-log"></section>
  <section class="panel" id="p-setup"></section>
</div>

<nav>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Cycle</button>
  <button data-tab="add" class="on"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  <button data-tab="pending"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Pending<span class="badge" id="penBadge" hidden></span></button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Log</button>
</nav>
<div class="sheet" id="sheet"><div class="inner" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

const p2=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const dOf=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=dOf(s);d.setDate(d.getDate()+n);return isoOf(d);};

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtShort=s=>{const d=dOf(s);return d.getDate()+" "+MON[d.getMonth()];};
const fmtFull=s=>{const d=dOf(s);return WD[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();};
const todayIso=()=>isoOf(new Date());

function parseTyped(str){
  const s=String(str).trim().toLowerCase(); if(!s) return null;
  const now=new Date();
  const bare=s.replace(/\s/g,"");
  if(/^\d{4}$|^\d{6}$|^\d{8}$/.test(bare)&&!/^\d{4}-/.test(s)){
    const L=bare.length;
    const a=+bare.slice(0,2),b=+bare.slice(2,4);
    let y=L===4?now.getFullYear():L===6?2000+ +bare.slice(4,6):+bare.slice(4,8);
    let day,mo; if(S.settings.dateFormat==="MDY"){mo=a;day=b;}else{day=a;mo=b;}
    if(mo>=1&&mo<=12&&day>=1&&day<=31){const d=new Date(y,mo-1,day);
      if(d.getMonth()===mo-1)return isoOf(d);}
  }
  let m=s.match(/^(\d{1,2})[\/\.\- ](\d{1,2})(?:[\/\.\- ](\d{2,4}))?$/);
  if(m){let a=+m[1],b=+m[2],y=m[3]?+m[3]:now.getFullYear(); if(y<100)y+=2000;
    let day,mo; if(S.settings.dateFormat==="MDY"){mo=a;day=b;}else{day=a;mo=b;}
    if(mo<1||mo>12||day<1||day>31) return null;
    const d=new Date(y,mo-1,day); return d.getMonth()===mo-1?isoOf(d):null;}
  m=s.match(/^(\d{1,2})\s*([a-z]{3,})\.?\s*(\d{2,4})?$/);
  if(m){const mi=MON.findIndex(x=>m[2].startsWith(x.toLowerCase())); if(mi<0)return null;
    let y=m[3]?+m[3]:now.getFullYear(); if(y<100)y+=2000; return isoOf(new Date(y,mi,+m[1]));}
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(s==="today") return todayIso();
  if(s==="yesterday") return addDays(todayIso(),-1);
  return null;
}
const typedOf=s=>{const d=dOf(s);return S.settings.dateFormat==="MDY"
  ?p2(d.getMonth()+1)+"/"+p2(d.getDate())+"/"+String(d.getFullYear()).slice(2)
  :p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2);};

/* ---------- cycles ---------- */
function ensureCycles(iso){
  let last=S.cycles[S.cycles.length-1];
  while(iso>last.e){
    const s=addDays(last.e,1);
    S.cycles.push({i:S.cycles.length,s,e:addDays(s,27)});
    last=S.cycles[S.cycles.length-1];
  }
  return last;
}
function cycleFor(iso){
  ensureCycles(iso);
  for(const c of S.cycles) if(iso>=c.s&&iso<=c.e) return c.i;
  return 0;
}
const nowCycle=()=>cycleFor(todayIso());
const cyc=i=>S.cycles[Math.max(0,Math.min(S.cycles.length-1,i))];

/* line matching */
function lineMatches(l,t){
  if(l.kind==="subs") return l.subs.includes(t.s);
  if(l.kind==="group"){const g=groupOf(t.s);return g&&g.id===l.g;}
  return false;
}
function planFor(i){
  const b=S.budgets[String(i)]||{};
  const list=txIn(i), used=new Set();
  const out=S.lines.map(l=>{
    let spent=0;
    if(l.kind==="savings") spent=savIn(i).reduce((a,x)=>a+x.a,0);
    else for(const t of list){ if(used.has(t.id))continue; if(lineMatches(l,t)){spent+=t.a;used.add(t.id);} }
    const bud=b[l.id]||0;
    return {line:l,bud,spent,rem:cents(bud-spent)};
  });
  const loose=list.filter(t=>!used.has(t.id));
  return {rows:out,loose};
}

/* ---------- carry-over ---------- */
function planTotals(i){
  const b=S.budgets[String(i)]||{},list=txIn(i),used=new Set();
  let alloc=0,spent=0;
  for(const l of S.lines){
    alloc+=b[l.id]||0;
    if(l.kind==="savings"){spent+=sumOf(savIn(i));continue;}
    for(const t of list){if(used.has(t.id))continue;if(lineMatches(l,t)){spent+=t.a;used.add(t.id);}}
  }
  return {alloc,spent};
}
function openingBal(i){
  const ov=(S.carry&&S.carry.set)||{};
  if(ov[String(i)]!=null)return ov[String(i)];
  return +(bankBal()
    - sumOf(incIn(i))
    + txIn(i).filter(t=>!t.p).reduce((a,t)=>a+t.a,0)
    + savIn(i).filter(t=>!t.p).reduce((a,t)=>a+t.a,0)).toFixed(2);
}
function carriedInto(i){
  const c=S.carry||{},ov=c.set||{};
  if(ov[String(i)]!=null)return ov[String(i)];      /* you set it by hand */
  if(!c.on||c.from==null||i<=c.from)return 0;
  let carry=0;
  for(let k=c.from;k<i;k++){
    if(ov[String(k)]!=null)carry=ov[String(k)];      /* a hand-set figure resets the chain */
    const t=planTotals(k);carry=carry+t.alloc-t.spent;
  }
  return +carry.toFixed(2);
}

/* ---------- expected income ---------- */
function expectedIn(i){
  if(S.expect&&S.expect[String(i)]!=null)return S.expect[String(i)];
  const past=[];
  for(let k=i-1;k>=0&&past.length<3;k--){const v=sumOf(incIn(k));if(v>0)past.push(v);}
  return past.length?+(past.reduce((a,b)=>a+b,0)/past.length).toFixed(2):0;
}
function avgSpend(i,n){
  const past=[];
  for(let k=i-1;k>=0&&past.length<n;k--){if(txIn(k).length)past.push(sumOf(txIn(k)));}
  return past.length?past.reduce((a,b)=>a+b,0)/past.length:0;
}

/* ---------- type-to-filter combo ---------- */
function combo(root,getItems,opt){
  opt=opt||{};
  root.classList.add("combo");
  root.innerHTML=`<input class="inp" autocomplete="off" autocapitalize="words" placeholder="${esc(opt.placeholder||"Type or pick")}">
    <button type="button" class="comboArrow" tabindex="-1" aria-label="Show list">▼</button>
    <div class="comboList" hidden></div>`;
  const inp=root.querySelector("input"),list=root.querySelector(".comboList"),arrow=root.querySelector(".comboArrow");
  let id=opt.value||"";
  const items=()=>getItems()||[];
  const nameOf=i=>{const x=items().find(y=>y.id===i);return x?x.name:"";};
  if(id)inp.value=nameOf(id);
  function draw(){
    try{const rc=root.getBoundingClientRect();root.classList.toggle("up",rc.bottom+250>window.innerHeight&&rc.top>260);}catch(e){}
    const q=inp.value.trim().toLowerCase();
    let arr=items();
    if(q){
      const st=arr.filter(x=>x.name.toLowerCase().startsWith(q));
      const inn=arr.filter(x=>!x.name.toLowerCase().startsWith(q)&&x.name.toLowerCase().includes(q));
      arr=st.concat(inn);
    }
    const CAP=q?60:8;
    let h=arr.slice(0,CAP).map(x=>`<button type="button" class="comboItem" data-id="${x.id}">${esc(x.name)}${x.sub?`<i>${esc(x.sub)}</i>`:""}</button>`).join("");
    if(!q&&arr.length>CAP)h+=`<div class="comboEmpty">+${arr.length-CAP} more — type to search</div>`;
    const exact=items().some(x=>x.name.toLowerCase()===q);
    if(opt.allowNew&&q&&!exact)
      h=`<button type="button" class="comboItem new" data-new="1">${esc(opt.newLabel||"Use")} “${esc(inp.value.trim())}”${opt.onNew?"":" — new"}</button>`+h;
    list.innerHTML=h||`<div class="comboEmpty">Nothing matches</div>`;
    list.hidden=false;
  }
  const close=()=>{list.hidden=true;};
  inp.addEventListener("focus",draw);
  inp.addEventListener("input",draw);
  inp.addEventListener("blur",()=>setTimeout(()=>{
    close();
    const q=inp.value.trim().toLowerCase();
    const hit=items().find(x=>x.name.toLowerCase()===q);
    if(hit){id=hit.id;inp.value=hit.name;}
    else if(!opt.allowNew)inp.value=nameOf(id);
  },180));
  arrow.addEventListener("pointerdown",e=>{e.preventDefault();
    if(!list.hidden){close();return;} inp.focus();inp.select();draw();});
  let touchStartY=0,touchMoved=false;
  list.addEventListener("touchstart",e=>{touchStartY=e.touches[0].clientY;touchMoved=false;},{passive:true});
  list.addEventListener("touchmove",e=>{
    if(Math.abs(e.touches[0].clientY-touchStartY)>6)touchMoved=true;
  },{passive:true});
  function pick(b){
    if(b.dataset.new){
      const typed=inp.value.trim();
      close(); inp.blur();
      if(opt.onNew){opt.onNew(typed,newId=>{id=newId;inp.value=nameOf(newId);});return;}
      id="";return;
    }
    id=b.dataset.id;inp.value=nameOf(id);
    close(); inp.blur(); if(opt.onPick)opt.onPick(id);
  }
  list.addEventListener("touchend",e=>{
    if(touchMoved)return;
    const b=e.target.closest(".comboItem"); if(!b)return;
    e.preventDefault(); pick(b);
  });
  list.addEventListener("click",e=>{
    const b=e.target.closest(".comboItem"); if(!b)return;
    pick(b);
  });
  return {
    get id(){const q=inp.value.trim().toLowerCase();
      const hit=items().find(x=>x.name.toLowerCase()===q);return hit?hit.id:(q?id&&nameOf(id).toLowerCase()===q?id:"":id);},
    get text(){return inp.value.trim();},
    set(v){id=v;inp.value=nameOf(v);},
    focus(){inp.focus();}
  };
}

/* ---------- subscriptions ---------- */
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function advance(r,iso){
  const d=dOf(iso);let y=d.getFullYear(),m=d.getMonth()+1;
  if(r.freq==="yearly")y+=1;
  else if(r.freq==="weekly")return addDays(iso,7);
  else if(r.freq==="cycle")return addDays(iso,28);
  else {m+=1;if(m>12){m=1;y+=1;}}
  const day=Math.min(r.day||d.getDate(),daysInMonth(y,m));
  return y+"-"+p2(m)+"-"+p2(day);
}
function runRecurring(){
  const today=todayIso();let made=0,total=0;
  for(const r of S.recur||[]){
    if(!r.on||!r.next)continue;
    let d=r.next,guard=0;
    while(d<=today&&guard++<60){
      const y=cycleFor(d);
      S.tx.push({id:uid("t"),ts:Date.now(),d,n:r.n,a:+(+r.a).toFixed(2),s:r.s,r:r.r,k:r.k,y,p:1,src:r.id});
      made++;total+=+r.a;d=advance(r,d);
    }
    r.next=d;
  }
  if(made)save();
  return {made,total};
}
const recurMonthly=()=>(S.recur||[]).filter(r=>r.on)
  .reduce((a,r)=>a+(+r.a)*(r.freq==="yearly"?1/12:r.freq==="weekly"?4.345:r.freq==="cycle"?365/28/12:1),0);

/* ---------- statistics ---------- */
function statsIdx(){
  const now=nowCycle();let idx=[];
  for(let i=0;i<=now;i++)idx.push(i);
  while(idx.length>1&&!txIn(idx[0]).length&&!incIn(idx[0]).length&&!savIn(idx[0]).length)idx.shift();
  const w=view.win===undefined?(+S.settings.statsWin||0):view.win;
  return w?idx.slice(-w):idx;
}
function chartBars(idx,spend,income,budget){
  const W=340,H=150,PT=16,PB=17,PL=3,PR=3;
  const n=idx.length||1;
  const max=Math.max(1,...spend,...income)*1.08;
  const iw=(W-PL-PR)/n, bw=Math.max(3,Math.min(24,iw*0.58));
  const yOf=v=>PT+(H-PT-PB)*(1-v/max);
  let bars="",hit="",pts=[],dots="",labs="";
  const step=Math.ceil(n/6);
  idx.forEach((ci,k)=>{
    const cx=PL+iw*k+iw/2, h=Math.max(1,(H-PT-PB)*Math.max(0,spend[k])/max);
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(H-PB-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)" opacity="${view.pick===ci?1:.8}"/>`;
    if(budget[k]>0){const by=yOf(budget[k]);
      bars+=`<line x1="${(cx-bw/2-1).toFixed(1)}" y1="${by.toFixed(1)}" x2="${(cx+bw/2+1).toFixed(1)}" y2="${by.toFixed(1)}" stroke="var(--ink)" stroke-width="1.2" opacity=".45"/>`;}
    pts.push(cx.toFixed(1)+","+yOf(income[k]).toFixed(1));
    dots+=`<circle cx="${cx.toFixed(1)}" cy="${yOf(income[k]).toFixed(1)}" r="${view.pick===ci?3:2}" fill="var(--income)"/>`;
    if(k%step===0||k===n-1)labs+=`<text x="${cx.toFixed(1)}" y="${H-4}" font-size="9" fill="var(--faint)" text-anchor="middle">${MON[dOf(cyc(ci).s).getMonth()]}</text>`;
    hit+=`<rect x="${(PL+iw*k).toFixed(1)}" y="0" width="${iw.toFixed(1)}" height="${H-PB}" fill="transparent" data-bar="${ci}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    <line x1="0" y1="${H-PB}" x2="${W}" y2="${H-PB}" stroke="var(--line)" stroke-width="1"/>
    ${bars}<polyline points="${pts.join(" ")}" fill="none" stroke="var(--income)" stroke-width="1.6"/>${dots}${labs}${hit}</svg>`;
}
function chartLine(vals,idx){
  const W=340,H=100,PT=10,PB=16,PL=3,PR=3;
  const n=vals.length||1,max=Math.max(1,...vals)*1.06;
  const iw=n>1?(W-PL-PR)/(n-1):0;
  const pts=vals.map((v,k)=>(PL+iw*k).toFixed(1)+","+(PT+(H-PT-PB)*(1-v/max)).toFixed(1));
  const area=`${PL},${H-PB} `+pts.join(" ")+` ${(PL+iw*(n-1)).toFixed(1)},${H-PB}`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    <polygon points="${area}" fill="var(--save)" opacity=".13"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--save)" stroke-width="1.8"/>
    <line x1="0" y1="${H-PB}" x2="${W}" y2="${H-PB}" stroke="var(--line)"/>
    <text x="0" y="${H-4}" font-size="9" fill="var(--faint)">${idx.length?MON[dOf(cyc(idx[0]).s).getMonth()]+" "+dOf(cyc(idx[0]).s).getFullYear():""}</text>
    <text x="${W}" y="${H-4}" font-size="9" fill="var(--faint)" text-anchor="end">now</text></svg>`;
}

  const ci=nowCycle(),c=cyc(ci),cSpend=sumOf(txIn(ci)),cInc=sumOf(incIn(ci)),cSav=sumOf(savIn(ci));
  const cBud=Object.values(S.budgets[String(ci)]||{}).reduce((a,v)=>a+v,0);
  const cTotal=cents(cInc-cSpend-cSav),cPend=sumOf(txIn(ci).filter(t=>t.p));
  const today=todayIso();let el=today<c.s?0:today>c.e?28:between(today,c.s)+1;
  const pct=cBud>0?Math.min(100,cSpend/cBud*100):(cSpend>0?100:0);
  const thisCycle=`<div class="card" style="padding:15px 16px">
      <div class="legend"><span>This cycle · ${fmtShort(c.s)} – ${fmtShort(c.e)} · day ${el} of 28</span>
        <button class="chip" data-tabjump="plan" style="padding:4px 12px;min-height:30px">Open</button></div>
      <div class="bar ${cBud>0&&cSpend>cBud?"over":""}" style="margin:12px 0 6px"><div class="fill" style="width:${pct}%"></div>
        ${el>0&&el<28?`<div class="pace" style="left:${el/28*100}%"></div>`:""}</div>
      <div class="legend num"><span>${money(cSpend)} of ${money(cBud)} planned</span>
        <b style="${cTotal<0?"color:var(--over)":"color:var(--good)"}">${money(cTotal)} ${cTotal<0?"short":"left"} after savings</b></div>
      <div class="stats">
        <div class="stat in"><b class="num">${money0(cInc)}</b><span>income</span></div>
        <div class="stat"><b class="num">${money0(cSpend)}</b><span>spent</span></div>
        <div class="stat sv"><b class="num">${money0(cSav)}</b><span>saved</span></div>
        <div class="stat"><b class="num" style="${cPend?"color:var(--over)":""}">${money0(cPend)}</b><span>pending</span></div>
      </div></div>`;

  const open=!!view.accOpen;
  const accounts=`<div class="card flush">
      <button class="fold" data-fold="acc"><span>ACCOUNTS</span><span class="chev">${open?"Hide ▴":"Show ▾"}</span></button>
      ${open?S.accounts.map(accRow).join("")+`
        <div class="row" style="background:var(--soft)"><div class="main"><b>${esc(S.labels.sav)}</b></div><div class="amt num sv">${money(svTot)}</div></div>
        <div class="row" style="background:var(--soft)"><div class="main"><b>${esc(S.labels.net)}</b><span>checking plus savings</span></div><div class="amt num">${money(bank+svTot)}</div></div>`
      :`<button class="row" data-fold="acc"><div class="main"><b>Checking ${money(bank)} · Savings ${money(svTot)}</b>
          <span>Pending ${money(pend)} · Preorders ${money(pre)}</span></div></button>`}
    </div>`;

  const hist=`<div class="card flush"><button class="row" data-tabjump="history">
      <div class="main"><b>History &amp; charts</b><span>${statsIdx().length===S.cycles.length?"All time":statsIdx().length+" cycles"} · ${S.tx.length} entries</span></div>
      <div class="amt" style="color:var(--faint);font-weight:400">›</div></button></div>`;

  $("#p-stats").innerHTML=lowWarning()+hero+thisCycle+accounts+hist;
}

function renderHistory(){
  const idx=statsIdx(),n=idx.length;
  const spend=idx.map(i=>sumOf(txIn(i))),income=idx.map(i=>sumOf(incIn(i))),
        saved=idx.map(i=>sumOf(savIn(i))),
        budget=idx.map(i=>{const b=S.budgets[String(i)]||{};return Object.values(b).reduce((a,v)=>a+v,0);});
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const tSpend=spend.reduce((a,b)=>a+b,0),tInc=income.reduce((a,b)=>a+b,0),tSav=saved.reduce((a,b)=>a+b,0);
  let run=0;const runs={};for(let i=0;i<=nowCycle();i++){run+=sumOf(savIn(i));runs[i]=run;}
  const bal=idx.map(i=>runs[i]);
  const w=view.win===undefined?(+S.settings.statsWin||0):view.win;
  const picker=`<div class="chips" style="margin-top:12px">
    ${[[6,"6 cycles"],[12,"12 cycles"],[24,"24 cycles"],[0,"All time"]].map(([v,l])=>
      `<button class="chip ${w===v?"on":""}" data-win="${v}">${l}</button>`).join("")}</div>`;
  const leftover=tInc-tSpend-tSav;
  const kpis=`<div class="kpis">
    <div class="kpi"><b class="num">${money0(avg(spend))}</b><span>average spend a cycle</span></div>
    <div class="kpi in"><b class="num">${money0(avg(income))}</b><span>average income</span></div>
    <div class="kpi sv"><b class="num">${money0(avg(saved))}</b><span>average put away</span></div>
    <div class="kpi ${leftover<0?"neg":""}"><b class="num">${money0(leftover)}</b><span>${leftover<0?"short over":"left over across"} ${n} cycles</span></div>
  </div>`;
  const p=view.pick,pk=idx.indexOf(p);
  const readout=pk>=0
    ? `<div class="readout"><span>${fmtShort(cyc(p).s)} – ${fmtShort(cyc(p).e)} ${dOf(cyc(p).e).getFullYear()}</span>
       <b class="num">${money(spend[pk])} spent · ${money(income[pk])} in</b></div>`
    : `<div class="readout"><span>Tap a bar for one cycle</span><b class="num">${money(tSpend)} over ${n}</b></div>`;
  const chart1=`<div class="card"><h2>Spending and income by cycle</h2>
    ${readout}<div class="chartbox">${chartBars(idx,spend,income,budget)}</div>
    <div class="keys"><span><i class="swatch" style="background:var(--accent)"></i>spent</span>
      <span><i class="swatch" style="background:var(--income)"></i>income</span>
      <span><i class="swatch" style="background:var(--ink);opacity:.45;height:2px;border-radius:0"></i>planned</span></div></div>`;
  const chart2=`<div class="card"><h2>Savings balance</h2>
    <div class="readout"><span>Built up since ${idx.length?fmtShort(cyc(idx[0]).s)+" "+dOf(cyc(idx[0]).s).getFullYear():""}</span><b class="num">${money(run)}</b></div>
    <div class="chartbox">${chartLine(bal,idx)}</div></div>`;
  const tot={},subT={};
  for(const i of idx)for(const t of txIn(i)){const c=catOf(t.s);if(!c)continue;
    tot[c.id]=(tot[c.id]||0)+t.a;subT[t.s]=(subT[t.s]||0)+t.a;}
  const cl=Object.entries(tot).sort((a,b)=>b[1]-a[1]),cmax=cl.length?cl[0][1]:1;
  const catCap=view.allCats?cl.length:Math.min(10,cl.length);
  const cats=cl.slice(0,catCap).map(([cid,v])=>{
    const isOpen=view.openCat===cid;
    const subs=isOpen?subsOfCat(cid).map(s=>[s,subT[s.id]||0]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]):[];
    return `<button class="hbar" data-cat="${cid}"><div class="hl"><b>${esc((byId(S.cats,cid)||{}).name)}</b>
        <div class="track"><i style="width:${(v/cmax*100).toFixed(1)}%"></i></div></div>
      <div class="hv num">${money0(v)}<small>${tSpend>0?Math.round(v/tSpend*100):0}%</small></div></button>`
      +subs.map(([s,sv])=>`<div class="row sub"><div class="main"><b>${esc(s.name)}</b></div><div class="amt num" style="font-weight:500;color:var(--muted)">${money(sv)}</div></div>`).join("");
  }).join("")+(cl.length>10?`<button class="row" data-toggle="allCats" style="justify-content:center;color:var(--accent);font-weight:600">${view.allCats?"Show top 10 only":"Show all "+cl.length+" categories"}</button>`:"");
  const kt={};for(const i of idx)for(const t of txIn(i))kt[t.k]=(kt[t.k]||0)+t.a;
  const kl=Object.entries(kt).sort((a,b)=>b[1]-a[1]),kmax=kl.length?kl[0][1]:1;
  const cards=kl.map(([k,v])=>`<div class="hbar"><div class="hl"><b>${esc(cardName(k)||"—")}</b>
      <div class="track"><i style="width:${(v/kmax*100).toFixed(1)}%"></i></div></div><div class="hv num">${money0(v)}</div></div>`).join("");
  const rt={};for(const i of idx)for(const t of txIn(i))if(t.r)rt[t.r]=(rt[t.r]||0)+t.a;
  const rl=Object.entries(rt).sort((a,b)=>b[1]-a[1]).slice(0,8),rmax=rl.length?rl[0][1]:1;
  const rets=rl.map(([r,v])=>`<div class="hbar"><div class="hl"><b>${esc(retName(r))}</b>
      <div class="track"><i style="width:${(v/rmax*100).toFixed(1)}%"></i></div></div><div class="hv num">${money0(v)}</div></div>`).join("");
  let big=[];for(const i of idx)big=big.concat(txIn(i));
  big=big.filter(t=>t.a>0).sort((a,b)=>b.a-a.a).slice(0,6);
  const bigHtml=big.map(t=>`<button class="row" data-edit="${t.id}" data-kind="tx">
    <div class="main"><b>${esc(t.n||subName(t.s))}</b><span>${fmtShort(t.d)} · ${esc(subName(t.s))}</span></div>${amtHtml(t.a)}</button>`).join("");
  const refunds=[];for(const i of idx)for(const t of txIn(i))if(t.a<0)refunds.push(t);
  $("#p-history").innerHTML=picker+kpis+chart1+chart2+
    `<div class="card" style="padding:14px 16px 4px"><h2 style="margin:0">By category — tap to open up</h2></div>
     <div class="card flush">${cats||'<div class="empty">Nothing in this window.</div>'}</div>`+
    `<div class="card" style="padding:14px 16px 4px"><h2 style="margin:0">By payment method</h2></div>
     <div class="card flush">${cards||'<div class="empty">Nothing yet.</div>'}</div>`+
    `<div class="card" style="padding:14px 16px 4px"><h2 style="margin:0">Where the money goes</h2></div>
     <div class="card flush">${rets||'<div class="empty">No retailers recorded.</div>'}</div>`+
    `<div class="card" style="padding:14px 16px 4px"><h2 style="margin:0">Biggest single purchases</h2></div>
     <div class="card flush">${bigHtml||'<div class="empty">Nothing yet.</div>'}</div>`+
    (refunds.length?`<div class="card"><div class="legend"><span>${refunds.length} refunds in this window</span><b class="num" style="color:var(--income)">+${money(Math.abs(sumOf(refunds)))}</b></div></div>`:"");
}

/* ---------- pending ---------- */
function renderPending(){
  const list=pendingTx().slice().sort((a,b)=>a.d<b.d?1:-1);
  const psav=pendSav().slice().sort((a,b)=>a.d<b.d?1:-1);
  const savBlock=psav.length?`<div class="card flush" style="margin-top:12px">
      <div class="daylabel" style="border-top:none">Savings transfers on the way · <span class="num">${money(savIncoming())}</span></div>
      ${psav.map(t=>`<div class="row">
        <button class="check" data-clearsav="${t.id}" aria-label="Mark as landed">✓</button>
        <button class="main" style="text-align:left;padding:0" data-edit="${t.id}" data-kind="sav">
          <b>${esc(t.n)}</b><span>${fmtShort(t.d)} · ${t.a<0?"coming out of savings":"going into savings"}</span></button>
        <div class="amt sv num">${money(t.a)}</div></div>`).join("")}
    </div>`:"";
  const total=openBalance();
  const charges=list.filter(t=>t.a>0),refs=list.filter(t=>t.a<0);
  if(!list.length&&!psav.length){
    $("#p-pending").innerHTML=`<div class="card flush"><div class="empty"><b>Nothing waiting</b>
      Everything you've logged has cleared. Mark an entry as pending when you've paid but it hasn't hit the account yet.</div></div>
      <div class="card"><button class="btn sm ghost" data-tabjump="subs">Subscriptions · ${money(recurMonthly())} a month</button></div>`;
    return;
  }
  if(!list.length){
    $("#p-pending").innerHTML=savBlock+`<div class="card"><button class="btn sm ghost" data-tabjump="subs">Subscriptions · ${money(recurMonthly())} a month</button></div>`;
    return;
  }
  const byCard={};
  for(const t of list){(byCard[t.k]=byCard[t.k]||[]).push(t);}
  let body="";
  for(const k in byCard){
    const g=byCard[k];
    body+=`<div class="daylabel">${esc(cardName(k)||"No card")} · <span class="num">${money(sumOf(g))}</span></div>`;
    body+=g.map(t=>`<div class="row">
      <button class="check" data-clear="${t.id}" aria-label="Mark as cleared">✓</button>
      <button class="main" style="text-align:left;padding:0" data-edit="${t.id}" data-kind="tx">
        <b>${esc(t.n||subName(t.s))}</b>
        <span>${fmtShort(t.d)} · ${esc(subName(t.s))}${t.r?" · "+esc(retName(t.r)):""}</span></button>
      ${amtHtml(t.a)}</div>`).join("");
  }
  $("#p-pending").innerHTML=lowWarning()+`
    <div class="card">
      <h2>Open balance</h2>
      <div class="meter-amt num">${money(total)}</div>
      <div class="meter-sub">${charges.length} charge${charges.length===1?"":"s"}${refs.length?" and "+refs.length+" refund"+(refs.length===1?"":"s"):""} not through yet</div>
      <div class="stats">
        <div class="stat"><b class="num">${money(bankBal())}</b><span>in checking now</span></div>
        <div class="stat"><b class="num" style="${freeToSpend()<floorOf()?"color:var(--over)":""}">${money(freeToSpend())}</b><span>once it all clears</span></div>
      </div>
    </div>
    <div class="card"><button class="btn sm ghost" data-tabjump="subs">Subscriptions · ${money(recurMonthly())} a month</button></div>
    <div class="card flush" style="margin-top:12px">${body}</div>${savBlock}
    <div class="card"><button class="btn sm ghost" id="clearAll">Mark everything as cleared</button></div>`;
}

const FIXED_DEFAULT=new Set(["Car Payment","Loan Payment","Phone Bill","Electric Bill","Insurance","Subscriptions","Rent"]);
const isFixed=l=>l.fixed!=null?!!l.fixed:FIXED_DEFAULT.has(l.name);

function renderPlan(){
  const i=view.cycle,c=cyc(i),{rows,loose}=planFor(i);
  const cv=view.cyView||"plan";
  const seg=`<div class="seg" style="margin-top:12px">
      ${[["plan","Plan"],["break","Breakdown"],["money","Money"]].map(([k,l])=>`<button class="${cv===k?"on":""}" data-cyview="${k}">${l}</button>`).join("")}</div>`;

  const spend=sumOf(txIn(i)),income=sumOf(incIn(i)),saved=sumOf(savIn(i));
  const budget=rows.reduce((a,r)=>a+r.bud,0),planSpent=rows.reduce((a,r)=>a+r.spent,0);
  const left=cents(budget-planSpent);
  const pct=budget>0?Math.min(100,planSpent/budget*100):(planSpent>0?100:0);
  const today=todayIso();let el=today<c.s?0:today>c.e?28:between(today,c.s)+1;
  const daysLeft=Math.max(0,28-el);
  const alloc=cents(budget);
  const expIn=expectedIn(i),gotIn=income,toCome=Math.max(0,expIn-gotIn);
  const fromSav=savIncoming(),opening=openingBal(i);
  const spentClear=txIn(i).filter(t=>!t.p).reduce((a,t)=>a+t.a,0);
  const savedOut=savIn(i).filter(t=>!t.p).reduce((a,t)=>a+t.a,0);
  const pendOut=openBalance(),pre=preorders();
  const onHand=freeToSpend(),cover=cents(onHand+toCome+fromSav),gap=cents(cover-alloc);

  if(cv==="plan"){
    const hero=`<div class="card">
      <h2>${left<0?"Over plan by":left>0?"Left in the plan":"Plan fully spent"}</h2>
      <div class="meter-amt num ${left<0?"over":left>0?"good":""}">${money(Math.abs(left))}</div>
      <div class="meter-sub num">${money(planSpent)} of ${money(budget)} allocated</div>
      <div class="bar ${left<0?"over":""}"><div class="fill" style="width:${pct}%"></div>
        ${el>0&&el<28?`<div class="pace" style="left:${el/28*100}%"></div>`:""}</div>
      <div class="legend"><span>Day ${el} of 28 · ${daysLeft} left</span>
        <span style="${gap<0?"color:var(--over)":"color:var(--good)"}">${gap<0?money(Math.abs(gap))+" more than you'll have":money(gap)+" spare vs money coming"}</span></div>
    </div>`;
    const line=r=>{
      const w=r.bud>0?Math.min(100,r.spent/r.bud*100):(r.spent>0?100:0);
      const cls=r.rem>0?"good":r.rem<0?"over":"";
      const tag=r.rem>0?"left":r.rem<0?"over":"nothing left";
      return `<button class="planline" data-line="${r.line.id}">
        <div class="pl"><b>${esc(r.line.name)}</b><span class="num">${money(r.spent)} of ${money(r.bud)}</span>
          <div class="catbar ${r.rem<0?"over":""}"><i style="width:${w}%"></i></div></div>
        <div class="pr num ${cls}">${money(Math.abs(r.rem))}<small>${tag}</small></div></button>`;};
    const F=view.folds||{};
    const fixed=rows.filter(r=>isFixed(r.line)&&(r.bud||r.spent));
    const flex=rows.filter(r=>!isFixed(r.line)&&(r.bud||r.spent));
    const empty=rows.filter(r=>!r.bud&&!r.spent);
    const fb=fixed.reduce((a,r)=>a+r.bud,0),fs=fixed.reduce((a,r)=>a+r.spent,0);
    const list=`<div class="card flush">
      ${fixed.length?`<button class="fold" data-fold="fixed"><span>FIXED · ${fixed.length} line${fixed.length===1?"":"s"}</span>
          <span class="chev num" style="${fs>fb?"color:var(--over)":""}">${money(fs)} of ${money(fb)} ${F.fixed?"▴":"▾"}</span></button>
        ${F.fixed?fixed.map(line).join(""):""}`:""}
      ${flex.length?`<div class="fold" style="cursor:default"><span>FLEXIBLE</span><span></span></div>${flex.map(line).join("")}`:""}
      ${empty.length?`<button class="fold" data-fold="empty"><span>${empty.length} EMPTY LINE${empty.length===1?"":"S"}</span><span class="chev">${F.empty?"Hide ▴":"Show ▾"}</span></button>
        ${F.empty?empty.map(line).join(""):""}`:""}
      <div class="planline" style="background:var(--soft)"><div class="pl"><b>Allocated altogether</b><span>${rows.filter(r=>r.bud>0).length} lines with a budget</span></div>
        <div class="pr num">${money(alloc)}</div></div>
      ${loose.length?`<button class="planline" data-loose="1"><div class="pl"><b>Not in the plan</b><span>${loose.length} entries with no matching line</span></div>
        <div class="pr num">${money(sumOf(loose))}</div></button>`:""}
    </div>
    <div class="card"><div class="hint" style="margin:0">Tap a line to set its budget. Fixed lines are bills that don't change much — mark any line fixed or flexible under the gear → Plan lines.</div></div>`;
    $("#p-plan").innerHTML=seg+hero+list;return;
  }

  if(cv==="break"){
    const list=txIn(i),tot={};
    for(const t of list){const c2=catOf(t.s);if(!c2)continue;
      tot[c2.id]=tot[c2.id]||{n:0,subs:{}};tot[c2.id].n+=t.a;tot[c2.id].subs[t.s]=(tot[c2.id].subs[t.s]||0)+t.a;}
    const gtot={};for(const cid in tot){const c2=byId(S.cats,cid);gtot[c2.g]=(gtot[c2.g]||0)+tot[cid].n;}
    let roll="";
    for(const g of S.groups){
      if(!gtot[g.id])continue;
      roll+=`<div class="daylabel" style="${roll?"":"border-top:none"}">${esc(g.name)} · <span class="num">${money(gtot[g.id])}</span></div>`;
      const cs=catsOfGroup(g.id).filter(c2=>tot[c2.id]).sort((a,b)=>tot[b.id].n-tot[a.id].n);
      for(const c2 of cs){
        roll+=`<div class="row"><div class="main"><b>${esc(c2.name)}</b></div><div class="amt num">${money(tot[c2.id].n)}</div></div>`;
        const ss=Object.entries(tot[c2.id].subs).sort((a,b)=>b[1]-a[1]);
        if(ss.length>1)for(const[sid,v]of ss)
          roll+=`<div class="row sub"><div class="main"><b>${esc(subName(sid))}</b></div><div class="amt num" style="font-weight:500;color:var(--muted)">${money(v)}</div></div>`;
      }
    }
    const top=`<div class="card"><h2>Spent this cycle</h2><div class="meter-amt num" style="font-size:34px">${money(spend)}</div>
      <div class="meter-sub">${list.length} entries · ${money(spend/Math.max(1,el))} a day so far</div></div>`;
    $("#p-plan").innerHTML=seg+top+(roll?`<div class="card flush">${roll}</div>`
      :`<div class="card flush"><div class="empty"><b>Nothing logged yet</b>Add an entry and the breakdown builds itself.</div></div>`);
    return;
  }

  /* money */
  const covPct=cover>0?Math.min(100,alloc/cover*100):(alloc>0?100:0);
  const ln=(lab,val,note,cls)=>`<div class="row" style="padding:9px 15px">
    <div class="main"><b style="font-weight:480;font-size:14.5px">${lab}</b>${note?`<span>${note}</span>`:""}</div>
    <div class="amt num ${cls||""}" style="font-size:14.5px">${val<0?"−":""}${money(Math.abs(val))}</div></div>`;
  const adds=`<div class="card">
      <h2>Does the plan add up?</h2>
      <div class="meter-amt num ${gap<0?"over":gap>0?"good":""}" style="font-size:32px">${money(Math.abs(gap))}</div>
      <div class="meter-sub">${gap<0?"more allocated than you'll have":gap>0?"spare after everything's allocated":"allocated to the penny"}</div>
      <div class="bar ${gap<0?"over":""}" style="margin:14px 0 8px"><div class="fill" style="width:${covPct}%"></div></div>
      <div class="legend"><span>${money(alloc)} allocated</span><span>${money(cover)} to cover it</span></div>
    </div>
    <div class="card flush">
      <div class="daylabel" style="border-top:none">Where that ${money(cover)} comes from</div>
      ${ln("Left over when the cycle began",opening,"everything you hadn't spent yet")}
      ${ln("Income so far",gotIn,null,"in")}
      ${toCome?ln("Still expected in",toCome,"tap below to change","in"):""}
      ${fromSav?ln("Coming out of savings",fromSav,null,"sv"):""}
      ${spentClear?ln("Spent so far",-spentClear):""}
      ${savedOut?ln("Put into savings",-savedOut,null,"sv"):""}
      ${pendOut?ln("Charges not cleared",-pendOut,null,"over"):""}
      ${pre?ln("Preorders",-pre):""}
      <div class="row" style="background:var(--soft);padding:11px 15px"><div class="main"><b>To cover the plan</b></div><div class="amt num">${money(cover)}</div></div>
    </div>
    <div class="card">
      <div class="legend" style="margin-bottom:8px"><span>You usually spend</span><b class="num">${money(avgSpend(i,6))}</b></div>
      <button class="btn sm ghost" data-expect="${i}">Expecting ${money(expIn)} in this cycle — change</button>
      <button class="btn sm ghost" data-carry="${i}">Opening balance ${money(opening)} — adjust</button>
      ${gap<0?`<button class="btn sm ghost" data-pullsav="${Math.abs(gap).toFixed(2)}" style="color:var(--save);border-color:var(--save)">Cover the ${money(Math.abs(gap))} from savings</button>`:""}
    </div>`;

    <div class="daylabel">Savings, in and out</div>

function inRange(d,y){
  const R=view.range;
  if(!R||R==="cycle")return y===view.cycle;
  if(R==="c3")return y<=view.cycle&&y>view.cycle-3;
  if(R==="all")return true;
  if(R&&R.from)return d>=R.from&&d<=R.to;
  return true;
}
function logMatches(r,kind){
  const q=(view.q||"").trim().toLowerCase();
  if(!q)return true;
  const bits=[r.n||""];
  if(kind==="tx"){bits.push(subName(r.s),retName(r.r),cardName(r.k));
    const c=catOf(r.s);if(c)bits.push(c.name);}
  else bits.push(kind==="inc"?"income":"savings");
  bits.push(String(Math.abs(r.a).toFixed(2)),fmtFull(r.d));
  return bits.join(" ").toLowerCase().includes(q);
}
function activeFilterCount(){
  let n=0;const R=view.range||"cycle";
  if(R!=="cycle")n++; if(view.filter)n++; if(view.byAdded)n++;
  return n;
}
function openFilters(){
  const R=view.range||"cycle",custom=R&&R.from;
  const rangeLbl={cycle:"This cycle",c3:"Last 3 cycles",all:"All time"};
  const cards=S.cards;
  openSheet(`<div class="sheethead"><h3>Filters</h3><button class="close" data-close>×</button></div>
    <div class="f"><span>Dates</span><div class="chips">
      ${["cycle","c3","all"].map(k=>`<button class="chip ${R===k?"on":""}" data-range="${k}">${rangeLbl[k]}</button>`).join("")}
      <button class="chip ${custom?"on":""}" data-range="custom">Between dates</button></div>
      ${custom?`<div class="rangewrap"><label>From<input type="date" id="rFrom" value="${R.from}"></label>
        <label>To<input type="date" id="rTo" value="${R.to}"></label></div>`:""}</div>
    <div class="f"><span>Category</span><div id="filtCat"></div></div>
    <div class="f"><span>Paid with</span><div class="chips">
      <button class="chip ${view.filter&&view.filter.type==="card"?"":"on"}" data-filter="">Any card</button>
      ${cards.map(c=>`<button class="chip ${view.filter&&view.filter.type==="card"&&view.filter.id===c.id?"on":""}" data-filter="card:${c.id}">${esc(c.name)}</button>`).join("")}</div></div>
    <div class="f"><span>Order</span><div class="seg">
      <button class="${view.byAdded?"":"on"}" data-sort="date">By date</button>

    <button class="btn" data-close>Show entries</button>
    ${activeFilterCount()?`<button class="btn sm ghost" id="clearFilters">Clear filters</button>`:""}`);
  const catFilterItems=()=>{
    const out=[];
    for(const g of S.groups)for(const c of catsOfGroup(g.id)){
      out.push({id:"cat:"+c.id,name:c.name,sub:g.name+" — whole category"});
      for(const x of subsOfCat(c.id))out.push({id:"sub:"+x.id,name:x.name,sub:g.name+" › "+c.name});
    }
    return out;
  };
  const cur=view.filter&&(view.filter.type==="cat"||view.filter.type==="sub")?view.filter.type+":"+view.filter.id:"";
  const cCombo=combo($("#filtCat"),catFilterItems,{value:cur,placeholder:"Any category",
    onPick:(v)=>{if(!v){view.filter=null;render();return;}
      const[t,id]=v.split(":");view.filter={type:t,id};render();}});
  if(!cur)cCombo.set("");

function renderLog(){
  const q=(view.q||"").trim(),R=view.range||"cycle",nf=activeFilterCount();
  let items=S.tx.map(r=>[r,"tx"]);
  if(q)items=items.concat(S.inc.map(r=>[r,"inc"]),S.sav.map(r=>[r,"sav"]));
  items=items.filter(([r,k])=>inRange(r.d,r.y)&&logMatches(r,k));
  if(view.filter&&!q){const f=view.filter;
    items=items.filter(([r,k])=>k!=="tx"?false:f.type==="card"?r.k===f.id:f.type==="cat"?(catOf(r.s)||{}).id===f.id:f.type==="sub"?r.s===f.id:true);}
  const spendTot=items.filter(([r,k])=>k==="tx").reduce((a,[r])=>a+r.a,0);
  const scope=R==="cycle"?"":R==="c3"?"Last 3 cycles":R==="all"?"All time":(R.from?fmtShort(R.from)+" – "+fmtShort(R.to):"");
  const head=`<div class="card" style="padding:12px 14px">
      <div class="two"><div class="searchwrap" style="flex:1"><input class="inp" id="logQ" value="${esc(q)}" placeholder="Search" autocomplete="off">
          ${q?`<button id="logQx" aria-label="Clear">×</button>`:""}</div>
        <button class="chip ${nf?"on":""}" id="openFilters" style="flex:none">Filters${nf?" · "+nf:""}</button></div>
      <div class="legend" style="margin-top:9px"><span>${items.length} ${q?"match"+(items.length===1?"":"es"):"entr"+(items.length===1?"y":"ies")}${scope?" · "+scope:""}${view.filter?" · "+esc(view.filter.type==="card"?cardName(view.filter.id):view.filter.type==="sub"?subName(view.filter.id):(byId(S.cats,view.filter.id)||{}).name):""}</span><b class="num">${money(spendTot)}</b></div>
    </div>`;
  if(!items.length){
    $("#p-log").innerHTML=head+`<div class="card flush"><div class="empty">
      <b>${q?"No matches":"Nothing here"}</b>${q?"Try fewer words, or widen the dates in Filters.":"Entries you add show up here."}</div></div>`;
    return;
  }
  const amt=(r,kind)=>`<div class="amt num ${kind==="inc"?"in":kind==="sav"?"sv":""} ${r.a<0&&kind==="tx"?"refund":""}">${r.a<0&&kind==="tx"?"+"+money(Math.abs(r.a)):money(r.a)}</div>`;
  if(view.byAdded){
    const withTs=items.filter(([r])=>addedAt(r)>0).sort((a,b)=>addedAt(b[0])-addedAt(a[0])).slice(0,120);
    if(!withTs.length){$("#p-log").innerHTML=head+`<div class="card flush"><div class="empty"><b>Nothing typed in yet</b>
        Entries imported from your sheet have no added time, so they don't appear in this order.</div></div>`;return;}
    let html=head+`<div class="card flush">`,day="";
    for(const [r,kind] of withTs){
      const d2=isoOf(new Date(addedAt(r)));
      if(d2!==day){day=d2;html+=`<div class="daylabel">Added ${fmtFull(day)}</div>`;}
      const label=kind==="tx"?esc(subName(r.s)):kind==="inc"?"Income":"Savings";
      html+=`<button class="row" data-edit="${r.id}" data-kind="${kind}"><div class="main"><b>${r.p?'<i class="pendot"></i>':""}${esc(r.n||"—")}</b>
        <span>${label} · dated ${fmtShort(r.d)}</span></div>${amt(r,kind)}</button>`;
    }
    $("#p-log").innerHTML=html+`</div>`;return;
  }
  const sorted=items.slice().sort((a,b)=>a[0].d===b[0].d?(a[0].id<b[0].id?1:-1):(a[0].d<b[0].d?1:-1)).slice(0,300);
  let html=head+`<div class="card flush">`,day="";
  for(const [r,kind] of sorted){
    if(r.d!==day){day=r.d;
      const dt=sorted.filter(([x,k])=>x.d===day&&k==="tx").reduce((a,[x])=>a+x.a,0);
      html+=`<div class="daylabel">${fmtFull(day)}${dt?` · <span class="num">${money(dt)}</span>`:""}</div>`;}
    let sub;
    if(kind==="tx"){const bits=[subName(r.s)];const rt=retName(r.r);if(rt)bits.push(rt);const k2=cardName(r.k);if(k2)bits.push(k2);
      sub=(r.p?"Not cleared yet · ":"")+bits.join(" · ");}
    else sub=kind==="inc"?"Income":"Savings";
    html+=`<button class="row" data-edit="${r.id}" data-kind="${kind}"><div class="main"><b>${r.p?'<i class="pendot"></i>':""}${esc(r.n||"—")}</b><span>${esc(sub)}</span></div>${amt(r,kind)}</button>`;
  }
  html+=`</div>${sorted.length<items.length?`<div class="card"><div class="hint" style="margin:0">Showing the first 300 of ${items.length}.</div></div>`:""}`;
  $("#p-log").innerHTML=html;
}

function setDate(iso){
  view.date=iso;$("#fDateText").value=typedOf(iso);$("#fDatePick").value=iso;
  const ci=cycleFor(iso),rel=ci-nowCycle();
  $("#dateEcho").textContent=fmtFull(iso)+(rel!==0?"  ·  lands in "+(rel<0?"an earlier":"a later")+" cycle":"");
  $("#dateEcho").classList.toggle("warn",rel!==0);
  document.querySelectorAll("[data-quick]").forEach(b=>b.classList.toggle("on",addDays(todayIso(),+b.dataset.quick)===iso));
}
function setMode(m){
  view.mode=m;
  $("#mSpend").classList.toggle("on",m==="spend");
  $("#mIncome").classList.toggle("on",m==="income");
  $("#mSave").classList.toggle("on",m==="save");
  $("#lblAmount").textContent=m==="save"?(view.wdraw?"Amount to take out":"Amount to put away"):m==="income"?"Amount":view.refund?"Refund amount":"Price";
  $("#lblName").textContent=m==="spend"?"Item name":m==="income"?"From":view.wdraw?"Taken from":"Moved to";
  $("#fName").placeholder=m==="spend"?"e.g. Bounty Hunter Funko":m==="income"?"e.g. Raytheon":"e.g. Apple Savings";
  for(const el of ["wCat","wRet","wCard"]) $("#"+el).style.display=m==="spend"?"":"none";
  $("#tRefund").style.display=m==="spend"?"":"none";
  $("#tPending").style.display=m==="spend"?"":"none";
  $("#tWithdraw").style.display=m==="save"?"":"none";

  $("#favThis").style.display=m==="spend"?"":"none";
  syncSaveLabel();
}
$("#tPending").onclick=()=>{view.pend=!view.pend;setMode(view.mode);};
$("#favThis").onclick=()=>{view.favThis=!view.favThis;$("#favThis").classList.toggle("on",!!view.favThis);

function syncSaveLabel(){

document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>setDate(addDays(todayIso(),+b.dataset.quick)));
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:NaN;};

function retIdFor(name){
  const n=name.trim(); if(!n) return "";
  const hit=S.retailers.find(r=>r.name.toLowerCase()===n.toLowerCase());
  if(hit) return hit.id;
  const r={id:uid("r"),name:n};S.retailers.push(r);fillSelects();toast("Added retailer “"+n+"”");
  return r.id;
}
$("#saveEntry").onclick=()=>{
  const a=num($("#fAmount").value);
  if(!isFinite(a)||a<=0){toast("Enter an amount above zero");$("#fAmount").focus();return;}
  const n=$("#fName").value.trim(),y=cycleFor(view.date);
  let delta=0;
  if(view.mode==="spend")delta=view.refund?a:-a;
  else if(view.mode==="income")delta=a;
  else delta=view.wdraw?a:-a;
  if(delta<0){
    const after=freeToSpend()+delta,f=floorOf();
    if(after<f&&!confirm("That leaves "+money(after)+(f?" against your "+money(f)+" cushion":" in checking")+
       ".\n\nAdd it anyway?"))return;
  }
  if(view.mode==="spend"){
    const sid=cCat.id||(S.subs[0]||{}).id,amt=view.refund?-Math.abs(a):a;
    const rec={id:uid("t"),ts:Date.now(),d:view.date,n:n||subName(sid),a:+amt.toFixed(2),s:sid,
               r:retIdFor(cRet.text),k:cCard.id||(S.cards[0]||{}).id,y};
    if(view.pend)rec.p=1;
    S.tx.push(rec);
    if(view.favThis){addFav(rec);view.favThis=false;$("#favThis").classList.remove("on");$("#favThis").textContent="♡";}
  } else if(view.mode==="income") S.inc.push({id:uid("i"),ts:Date.now(),d:view.date,n:n||"Income",a:+a.toFixed(2),y});
  else S.sav.push({id:uid("v"),ts:Date.now(),d:view.date,n:n||(view.wdraw?"Withdrawal":"Savings"),
                   a:+((view.wdraw?-a:a).toFixed(2)),y});
  save();$("#fAmount").value="";$("#fName").value="";
  view.cycle=y;
  toast(view.mode==="spend"&&view.refund?"Refund of "+money(a)+" logged"
       :view.mode==="save"&&view.wdraw?money(a)+" taken out of savings":"Added "+money(a));
  view.refund=false;view.wdraw=false;view.pend=false;setMode(view.mode);render();
};
